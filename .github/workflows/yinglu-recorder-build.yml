name: Build YingLu Screen Windows

on:
  push:
    branches: [ yinglu-recorder-build-v1 ]
    paths:
      - 'yinglu-recorder/**'
      - '.github/workflows/yinglu-recorder-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: yinglu-recorder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate source
        shell: pwsh
        run: |
          node --check main.js
          node --check preload.js
          node --check renderer.js
          $html = Get-Content index.html -Raw
          if ($html -notmatch 'id="recordBtn"') { throw 'recordBtn missing' }
          if ($html -notmatch 'id="keepAwakeToggle"') { throw 'stability controls missing' }
          if ((Get-Content package.json -Raw | ConvertFrom-Json).version -ne "1.6.0") { throw "Wrong version" }
      - name: Build Windows EXEs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis portable --x64
      - name: Verify products
        shell: pwsh
        run: |
          $files = @(
            "dist/YingLuScreen-Setup-1.6.0.exe",
            "dist/YingLuScreen-Portable-1.6.0.exe"
          )
          foreach($f in $files){
            if(!(Test-Path $f)){ throw "Missing $f" }
            if((Get-Item $f).Length -lt 30000000){ throw "Unexpectedly small $f" }
            $bytes = [IO.File]::ReadAllBytes($f)
            if($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A){ throw "Not a valid PE executable: $f" }
          }
          Get-FileHash $files -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: YingLuScreen-Windows-v1.6.0
          path: |
            yinglu-recorder/dist/YingLuScreen-Setup-1.6.0.exe
            yinglu-recorder/dist/YingLuScreen-Portable-1.6.0.exe
            yinglu-recorder/dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
